appId: com.pentak.cafe
productName: Penta-K Cafe
copyright: Copyright © Penta-K

directories:
  output: release
  buildResources: build

files:
  - dist/**/*
  - "!dist/logo-transparent.png"
  - "!dist/moon-cafe.svg"
  - dist-electron/**/*
  - package.json
  - "!node_modules/**/*"

asar: true
compression: normal
artifactName: Penta-K-Cafe-Setup-${version}.${ext}

win:
  executableName: Penta-K Cafe
  icon: build/icon.ico
  target:
    - target: nsis
      arch:
        - x64

nsis:
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Penta-K Cafe
  uninstallDisplayName: Penta-K Cafe
  deleteAppDataOnUninstall: false
